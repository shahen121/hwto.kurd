<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="sportGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem / Crest -->
  <g transform="translate(20, 16)">
    <!-- Shield Outer Glow & Border -->
    <path d="M60 4 L114 26 C114 78 86 112 60 124 C34 112 6 78 6 26 Z" 
          fill="rgba(16, 185, 129, 0.15)" stroke="url(#shieldGrad)" stroke-width="3.5" filter="url(#glow)"/>
    
    <!-- Shield Core -->
    <path d="M60 14 L104 32 C104 74 80 102 60 112 C40 102 16 74 16 32 Z" 
          fill="#0c1322" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Football / Modern Hexagon Motif in Center -->
    <circle cx="60" cy="58" r="26" fill="rgba(0, 230, 118, 0.12)" stroke="url(#cyanGrad)" stroke-width="2"/>
    <polygon points="60,42 73,50 73,66 60,74 47,66 47,50" fill="url(#shieldGrad)"/>
    <line x1="60" y1="42" x2="60" y2="32" stroke="#38bdf8" stroke-width="2"/>
    <line x1="73" y1="50" x2="82" y2="44" stroke="#38bdf8" stroke-width="2"/>
    <line x1="73" y1="66" x2="82" y2="72" stroke="#38bdf8" stroke-width="2"/>
    <line x1="60" y1="74" x2="60" y2="84" stroke="#38bdf8" stroke-width="2"/>
    <line x1="47" y1="66" x2="38" y2="72" stroke="#38bdf8" stroke-width="2"/>
    <line x1="47" y1="50" x2="38" y2="44" stroke="#38bdf8" stroke-width="2"/>

    <!-- Dynamic Speed Arcs -->
    <path d="M22 28 C40 18 80 18 98 28" fill="none" stroke="#00e676" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="116" r="3" fill="#00e676" />
  </g>

  <!-- Typography -->
  <!-- "hwto" Part -->
  <text x="160" y="86" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="-1" 
        fill="url(#textGrad)">hwto</text>

  <!-- Hyphen / Dash -->
  <rect x="312" y="62" width="16" height="6" rx="3" fill="#00e676" filter="url(#glow)" />

  <!-- "SPORT" Part -->
  <text x="340" y="86" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="2" 
        fill="url(#sportGrad)">SPORT</text>

  <!-- High-tech Sub-badge / Live Pulse Pill -->
  <g transform="translate(162, 104)">
    <rect x="0" y="0" width="76" height="20" rx="10" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
    <circle cx="12" cy="10" r="4" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fca5a5" letter-spacing="1">LIVE</text>

    <!-- Tagline text -->
    <text x="88" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
      SCORES &bull; FIXTURES &bull; STANDINGS
    </text>
  </g>
</svg>
