<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مشغّل الاختبار — hwto.kurd</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #eee; margin: 0; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    video { width: 100%; max-width: 900px; background: #000; display: block; border-radius: 8px; }
    #status { margin-top: 12px; font-size: 14px; color: #9aa; }
    label { display: block; margin: 16px 0 6px; font-size: 14px; color: #9aa; }
    input { width: 100%; max-width: 900px; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #161922; color: #eee; font-size: 13px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 18px; border: 0; border-radius: 6px; background: #3b82f6; color: #fff; font-size: 14px; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>مشغّل الاختبار (استخراج وتشغيل تلقائي)</h1>
  <video id="player" controls playsinline></video>
  <div id="status">جاهز للاختبار.</div>

  <label for="src">ضع رابط المشغل (مثل fastvip.space/e/...) أو رابط m3u8 مباشر:</label>
  <input id="src" type="text" value="https://fastvip.space/e/uw2xnhcfket2" />
  <button id="play">استخراج وتشغيل</button>

  <script src="/vendor/hls.min.js"></script>
  <script src="/player.js"></script>
</body>
</html>
